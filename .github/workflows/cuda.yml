name: CUDA Test

on:
  workflow_dispatch:
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on CUDA Build
    runs-on: gpu
    if: github.repository_owner == 'deepmodeling'
    container:
      image: ghcr.io/deepmodeling/abacus-cuda
      volumes:
        - /tmp/ccache:/github/home/.ccache
      options: --gpus all
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache xz-utils ninja-build

      - name: Install external tools from toolchain
        run: |
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure & Build
        run: |
          nvidia-smi
          source toolchain/install/setup
          rm -rf build
          cmake -B build -G Ninja -DUSE_CUDA=ON -DBUILD_TESTING=ON -DENABLE_FLOAT_FFTW=ON
          cmake --build build -j4
          cmake --install build

      - name: Test CUDA mixing support
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(MODULE_BASE_MIXING_unittests|MODULE_ESTATE_charge_mixing|MODULE_ESTATE_charge_mixing_kernels_gpu|MODULE_PW_pw_basis_sup_gpu_map|MODULE_HAMILT_XC_Functional_UTs|MODULE_HAMILT_XC_Formula_UTs|MODULE_HAMILT_XC_Public_UTs|MODULE_HAMILT_XC_Resident_UTs|MODULE_PSI_init_gpu_test)$'

      - name: Test GPU-resident mixing workflows
        run: |
          cd tests/11_PW_GPU
          # GPU PW FFT currently requires one MPI rank per pool.
          OMP_NUM_THREADS=1 bash ../integrate/Autotest.sh -n 1 -t 1e-3 -f CASES_MIXING_GPU.txt
          while read -r case_name; do
            grep -q 'INFO: Using GPU-resident reciprocal charge mixing.' \
              "${case_name}/OUT.autotest/running_scf.log"
            awk '/^ CG/ {
                   rows++
                   for (i = 2; i <= NF; ++i) {
                     value = tolower($i)
                     if (value ~ /^[+-]?(nan|inf|infinity)$/) bad = 1
                   }
                 }
                 END { exit !(rows == 3 && !bad) }' "${case_name}/log.txt"
            awk '/Number of plane waves =/ { values[++count] = $NF }
                 END { exit !(count >= 2 && values[1] != values[2]) }' \
              "${case_name}/OUT.autotest/running_scf.log"
          done < CASES_MIXING_GPU.txt
          grep -q 'DKIN' mixing_pulay_tau_spin2_double_grid/log.txt

      - name: Test GPU-resident USPP mixing workflows
        run: |
          cd tests/11_PW_GPU
          # GPU PW FFT currently requires one MPI rank per pool.
          OMP_NUM_THREADS=1 bash ../integrate/Autotest.sh -n 1 -t 1e-3 -f CASES_USPP_MIXING_GPU.txt
          while read -r case_name; do
            grep -q 'INFO: Using GPU-resident reciprocal charge mixing.' \
              "${case_name}/OUT.autotest/running_scf.log"
            grep -q 'INFO: Using GPU-resident USPP effective-D assembly.' \
              "${case_name}/OUT.autotest/running_scf.log"
            awk '/^ CG/ {
                   rows++
                   for (i = 2; i <= NF; ++i) {
                     value = tolower($i)
                     if (value ~ /^[+-]?(nan|inf|infinity)$/) bad = 1
                   }
                 }
                 END { exit !(rows == 3 && !bad) }' "${case_name}/log.txt"
            awk '/Number of plane waves =/ { values[++count] = $NF }
                 END { exit !(count >= 2 && values[1] != values[2]) }' \
              "${case_name}/OUT.autotest/running_scf.log"
          done < CASES_USPP_MIXING_GPU.txt
          grep -q 'DKIN' uspp_mixing_pulay_tau_spin2_double_grid/log.txt

      - name: Test 11_PW_GPU
        run: |
          cd tests/11_PW_GPU
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt

      - name: Test 12_NAO_Gamma_GPU
        run: |
          cd tests/12_NAO_Gamma_GPU
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt

      - name: Test 13_NAO_multik_GPU
        run: |
          cd tests/13_NAO_multik_GPU
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt

      - name: Test 15_rtTDDFT_GPU
        run: |
          cd tests/15_rtTDDFT_GPU
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt

      - name: Test 16_SDFT_GPU
        run: |
          cd tests/16_SDFT_GPU
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt
